name: Collect token holders

on:
  schedule:
    # 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 Asia/Shanghai (UTC+8, no DST)
    - cron: "0 16,20,0,4,8,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-token-holders
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect snapshots
        id: collect
        run: python collect.py
        env:
          PYTHONUNBUFFERED: "1"
        continue-on-error: true

      - name: Commit and push data
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: token holder snapshot"
          export GIT_EDITOR=true
          for i in 1 2 3 4 5; do
            git fetch --depth=50 origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              echo "rebase conflict; keeping this run's data and state"
              git checkout --theirs -- data state || true
              git add data state
              if ! git rebase --continue; then
                git rebase --abort || true
              fi
            fi
            echo "push attempt ${i} failed, retrying"
            sleep $((i * 2))
          done
          echo "push failed after retries"
          exit 1

      - name: Fail the run if any token failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
